plugins {
    id 'com.android.application'
}

android {
    namespace 'com.emeka45.myspotify'
    compileSdk 35

    defaultConfig {
        applicationId 'com.emeka45.myspotify'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}
